[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spin-optimal-control"
version = "0.2.0"
description = "Differentiable Optimal Control for Silicon Spin Exchange Gates under 1/f Pink Charge Noise and Overhauser Nuclear Spin Drift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jasper Sands" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "cirq>=1.3.0",
    "pennylane>=0.35.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
spin-control = "spin_optimal_control.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
